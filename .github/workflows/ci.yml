name: CI

on:
  push:
    branches: [main, ci]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: 웹 · 서버 (테스트, 빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # 빌드용 더미 값이다. 실제 DB에는 연결하지 않는다.
      DATABASE_URL: postgres://ci:ci@localhost/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx next build

  android:
    name: Android · 판정 엔진 (단위 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :app:testDebugUnitTest
